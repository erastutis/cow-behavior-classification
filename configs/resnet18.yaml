seed: 42

data:
  annotations_path: data/CBVD-5/annotations.csv
  manifest_path: data/processed/manifest.csv

model:
  name: resnet18
  image_size: 224
  clip_size: 1

training:
  head_epochs: 3
  finetune_epochs: 12
  batch_size: 32
  head_lr: 0.001
  finetune_lr: 0.0001
  focal_gamma: 2.0
  weighted_sampler: true
  threshold_strategy: per_class_optimized
  num_workers: 2
  output_dir: models/resnet18
